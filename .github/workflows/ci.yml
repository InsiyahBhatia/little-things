name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Check the bundle size
        run: |
          size=$(du -sm out | cut -f1)
          echo "Static site is ${size} MB"
          if [ "$size" -gt 10 ]; then
            echo "::error::The built site is ${size} MB. Keep debug art out of public/."
            exit 1
          fi
